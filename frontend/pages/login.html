<div class="page login-page">
  <form class="login-box" onsubmit="event.preventDefault(); login();">
    <h2>Login</h2>
    <div class="field">
          <input  maxlength="20"
 id="username" placeholder="Username">

      <div id="usernameError" class="error"></div>
    </div>

<div class="field password-row">
  <input id="password" type="password"   placeholder="Password">

  
</div>
<div class="show-password-inline">
<input type="checkbox" onclick="togglePassword()">
    <span>Show password</span>
</div>
    <div id="passwordError" class="error"></div>
    <button type="submit" class="btn btn-primary">Login</button>
    <div class="link">
      New user? <a href="#signup">Signup</a>
    </div>

<a class="google-button"href="http://localhost:8081/severletpage/auth/google_login">
   <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google image" 
   >

   Login in with Google
</a>


</form>
</div>
